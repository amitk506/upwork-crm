<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Upwork Agency Portal</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        padding: 2rem; text-align: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #f7f8fb; color: #15171f;
      }
      @media (prefers-color-scheme: dark) { body { background: #0c0e13; color: #edeff5; } }
      .mark { width: 56px; height: 56px; border-radius: 14px; background: #1aa05c; margin: 0 auto 1.25rem; }
      h1 { font-size: 1.25rem; letter-spacing: -0.02em; margin: 0 0 .5rem; }
      p { margin: 0; font-size: .9rem; line-height: 1.5; opacity: .7; max-width: 32ch; }
    </style>
  </head>
  <body>
    <div>
      <div class="mark"></div>
      <h1>No connection</h1>
      <!-- Deliberately not showing a cached inbox: a stale wait time reads as
           fact and is worse than an honest blank. -->
      <p>The portal needs a connection to show who is waiting. It will load as soon as you are back online.</p>
    </div>
  </body>
</html>
