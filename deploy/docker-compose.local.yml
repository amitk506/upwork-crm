# Local development stack: the same Postgres, GoTrue and PostgREST the server
# runs, plus a small nginx in place of Traefik so that one URL —
# http://localhost:8000 — serves /auth/v1 and /rest/v1 the way the deployed host
# does. The portal itself runs with `next dev` on the host, not in a container.
#
#   ./scripts/dev-stack.sh up      generate keys, start, migrate, create owner
#   ./scripts/dev-stack.sh down    stop and delete the data
#
# Only the gateway publishes a port (8000). Postgres stays on the compose
# network; psql reaches it through `docker compose exec`.
name: upwork-inbox-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.158.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: '9999'
      API_EXTERNAL_URL: http://localhost:8000/auth/v1
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${AUTH_ADMIN_PASSWORD}@postgres:5432/postgres?search_path=auth&sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_SMS_AUTOCONFIRM: 'true'
      GOTRUE_LOG_LEVEL: warn

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_OPENAPI_MODE: ignore-privileges

  # Stands in for Traefik: strips the /auth/v1 and /rest/v1 prefixes and
  # forwards to the right service, so the app's single SUPABASE_URL works.
  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth, rest]
    ports: ['8000:80']
    configs:
      - source: gateway
        target: /etc/nginx/conf.d/default.conf

configs:
  gateway:
    content: |
      # In production one hostname serves the portal, /auth/v1 and /rest/v1, so
      # the browser never makes a cross-origin call. Locally the portal is on
      # :3000 (or wherever next dev lands) and this gateway on :8000, so the
      # browser's requests are cross-origin and need CORS answered here.
      map $$http_origin $$cors_origin {
        default "";
        "~^http://localhost(:[0-9]+)?$$" $$http_origin;
        "~^http://127\.0\.0\.1(:[0-9]+)?$$" $$http_origin;
      }
      server {
        listen 80;
        client_max_body_size 20m;

        add_header Access-Control-Allow-Origin $$cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, prefer, range, accept-profile, content-profile, x-upsert" always;
        add_header Access-Control-Expose-Headers "content-range, x-supabase-api-version" always;

        location /auth/v1/ {
          if ($$request_method = OPTIONS) { return 204; }
          proxy_pass http://auth:9999/;
          proxy_set_header Host $$host;
          proxy_hide_header Access-Control-Allow-Origin;
        }
        location /rest/v1/ {
          if ($$request_method = OPTIONS) { return 204; }
          proxy_pass http://rest:3000/;
          proxy_set_header Host $$host;
          proxy_hide_header Access-Control-Allow-Origin;
        }
        location / { return 404; }
      }
